# 部署到腾讯 EdgeOne Makers（替代 GitHub Pages）。
#
# - 触发：push 到 main 或手动 workflow_dispatch。
# - 构建形态：默认根部署（无 base、build.format: 'directory'），与生产站一致，
#   不复用 DEPLOY_TARGET=github-pages 的 file 格式（那是绕开 GitHub Pages 目录 301 的特例）。
# - 部署：edgeone makers CLI 直传 dist/，项目名固定 tokenfleet-landing，
#   首次 deploy -n 会自动创建项目。
# - 认证：EDGEONE_API_TOKEN 为 EdgeOne Makers 控制台生成的 API Token，
#   存为 GitHub repository secret。
# - canonical / sitemap 默认指向生产站 tokenfleet.cn（镜像语义）；如需 EdgeOne
#   专属 URL，在 Build step 注入 SITE_URL 即可，无需改代码。
name: deploy-edgeone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 只保留一次进行中的部署；不取消进行中的那次，避免部署到一半被打断。
concurrency:
  group: edgeone
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 默认根部署形态：site=https://tokenfleet.cn、无 base、directory 格式。
      - name: Build
        # 如需 EdgeOne 专属 canonical/sitemap，取消下面 env 注释并填入目标域名。
        # env:
        #   SITE_URL: https://<edgeone-project>.edgeone.app
        run: npm run build

      # 直传静态产物到 EdgeOne Makers。若因缺 package.json / Makers Functions
      # 文件夹失败，回退为 CLI 自动构建模式：去掉 ./dist，让 CLI 读仓库
      # package.json 的 build 命令构建。
      # Token 经 env 注入，命令行只引用环境变量；GitHub 会自动打码 Secret 值。
      - name: Deploy to EdgeOne
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx edgeone makers deploy ./dist -n tokenfleet-landing -t $EDGEONE_API_TOKEN
