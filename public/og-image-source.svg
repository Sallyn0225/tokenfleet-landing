<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!--
    OG image source (SVG). Most link previewers require PNG / JPG, not SVG.
    Pre-launch: open in Figma or run a headless conversion (e.g.
    `npx @resvg/resvg-cli og-image-source.svg og-image.png`) and place the
    resulting PNG at public/og-image.png, then pass `ogImage="/og-image.png"`
    to <Base /> on the home page.
  -->
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4e0"/>
      <stop offset="35%" stop-color="#c4b9ff"/>
      <stop offset="70%" stop-color="#7d6dff"/>
      <stop offset="100%" stop-color="#ea2261"/>
    </linearGradient>
    <filter id="og-blur"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="360" fill="url(#ogBg)" opacity="0.85" filter="url(#og-blur)"/>

  <g transform="translate(96, 96)">
    <text x="0" y="40" font-family="Inter, sans-serif" font-size="28" font-weight="500" fill="#0d253d" letter-spacing="-0.4">
      <tspan>Token</tspan><tspan fill="#533afd">Fleet</tspan><tspan fill="#533afd" dx="2">.</tspan>
    </text>
  </g>

  <g transform="translate(96, 250)">
    <text font-family="Inter, sans-serif" font-size="76" font-weight="300" fill="#0d253d" letter-spacing="-2">
      <tspan x="0" dy="0">一个 API key，</tspan>
      <tspan x="0" dy="92">接入全部主流大模型。</tspan>
    </text>
  </g>

  <g transform="translate(96, 510)">
    <text font-family="JetBrains Mono, monospace" font-size="22" fill="#273951" letter-spacing="-0.2">
      <tspan>34 个生产级模型</tspan>
      <tspan dx="32">·</tspan>
      <tspan dx="32">OpenAI SDK 兼容</tspan>
      <tspan dx="32">·</tspan>
      <tspan dx="32">国内直连</tspan>
    </text>
  </g>
</svg>
